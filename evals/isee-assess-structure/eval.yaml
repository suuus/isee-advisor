name: isee-assess-structure-eval
description: Real eval for isee-assess-structure across three fixture profiles.
skill: isee-assess-structure
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 600
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.7
    description: Did the skill produce a structurally complete, well-grounded structure assessment?
graders:
  # Required headings and vocabulary
  - type: text
    name: required_structure
    weight: 2.0
    config:
      regex_match:
        - "(?i)structure layer"
        - "(?i)(present|absent|unknown)"
        - "(?i)(ci|continuous integration|workflow)"
        - "(?i)(guardrail|gate|constraint)"
        - "(?i)recommendation"

  # Grounding: must mention a real file from the fixture
  - type: text
    name: cites_fixture
    weight: 1.5
    config:
      contains:
        - ".yml"

  # Must cover key structure dimensions
  - type: text
    name: covers_structure_dimensions
    weight: 1.5
    config:
      regex_match:
        - "(?i)(branch protection|branch-protection|merge protection)"
        - "(?i)(coverage|lint|test)"
        - "(?i)(security scan|codeql|dependabot|vulnerability)"

  # No fabrication of files not in fixture
  - type: text
    name: no_fabrication
    weight: 1.0
    config:
      regex_not_match:
        - "(?i)(found|exists|contains|I see)\\s.{0,40}(Dockerfile|docker-compose|Makefile)"

tasks:
  - "tasks/*.yaml"
