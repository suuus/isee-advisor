id: structure-lightweight-startup
name: Assess structure in a lightweight-startup repo
description: |
  Lightweight profile: only a basic CI workflow exists (.github/ci.yml). No branch protection
  visible, no security scanning, no .mcp.json. The agent should score Structure as Developing,
  find CI as Present, mark branch protection and MCP scoping as Unknown, and recommend
  concrete next steps appropriate for a small team.
tags:
  - basic
  - happy-path
  - lightweight-profile
inputs:
  prompt: |
    Assess the Structure layer of the repository in the current working directory using the
    ISEE framework. Use the Lightweight profile (3-person startup).

    Apply your full procedure: scan for CI gates, branch protection signals, security scanning,
    MCP tool scoping, and codified constraints. Score each dimension Present/Absent/Unknown
    with confidence and citation. Emit the structured output per your output template.

    Do not ask clarifying questions — the profile is Lightweight, proceed with what you can discover.
  files:
    - path: lightweight-startup/README.md
    - path: lightweight-startup/package.json
    - path: lightweight-startup/.github/ci.yml
expected:
  output_contains:
    - "Structure"
  outcomes:
    - type: task_completed
