id: evidence-lightweight-startup
name: Assess evidence in a lightweight-startup repo
description: |
  Lightweight profile: basic CI present (.github/ci.yml), no CHANGELOG, no monitoring, no
  deploy feedback. The agent should score Evidence as Developing, find CI as Present, and
  mark monitoring and changelog as Absent with low-impact recommendations for the team size.
tags:
  - basic
  - happy-path
  - lightweight-profile
inputs:
  prompt: |
    Assess the Evidence layer of the repository in the current working directory using the
    ISEE framework. Use the Lightweight profile (3-person startup).

    Scan for CI reporting, monitoring/alerting, CHANGELOG, deploy feedback loops, and upstream
    signal flow (do insights feed back into decisions?). Score each dimension Present/Absent/Unknown
    with confidence and citation. Emit the structured output per your output template.

    Do not ask clarifying questions — the profile is Lightweight, proceed with what you can discover.
  files:
    - path: lightweight-startup/README.md
    - path: lightweight-startup/package.json
    - path: lightweight-startup/.github/ci.yml
expected:
  output_contains:
    - "Evidence"
  outcomes:
    - type: task_completed
