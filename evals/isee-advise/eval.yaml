name: isee-advise-eval
description: Real eval for isee-advise — framework Q&A with opinionated ISEE guidance.
skill: isee-advise
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 600
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.7
    description: Did the skill provide actionable ISEE-framed advice or correctly invoke ask_user?
graders:
  # ISEE framing: response must reference the framework OR ask for context before framing
  - type: text
    name: required_structure
    weight: 2.0
    config:
      regex_match:
        - "(?i)(layer|isee|framework|evidence|intent|structure|execution)"
        - "(?i)(recommend|next step|action|suggest|tell me|clarif|what.{0,20}scenario|could you|can you|share more|more detail|more context|help me understand|\\?)"

  # Names at least one ISEE layer, OR asks a clarifying question (both are correct)
  - type: text
    name: names_layers
    weight: 1.5
    config:
      regex_match:
        - "(?i)(intent|structure|execution|evidence|\\?)"

  # Provides concrete guidance OR asks a clarifying question (both are valid)
  - type: text
    name: concrete_guidance
    weight: 1.5
    config:
      regex_match:
        - "(?i)(step|action|how|what to do|start with|focus on|\\?|tell me|describe|scenario|current state|more (about|context|detail))"

  - type: text
    name: no_fabrication
    weight: 1.0
    config:
      regex_not_match:
        - "(?i)(found|exists|contains|I see)\\s.{0,40}(your repository|your codebase|your team)"

tasks:
  - "tasks/*.yaml"
